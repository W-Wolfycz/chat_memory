name: chat_memory
display_name: ChatMemory
short_desc: 全量对话记录存档、上下文接管与只读查询台插件
desc: 合并存储式对话存档：一条物理消息只存一份，多个 BOT 共享同一份事实，各自视角（谁发的、属于哪轮、什么状态）单独记。可选接管上下文（按轮 / 跨会话 / 整群 / 按 persona，工具调用一并回放），自带只读查询台（检索、工具调用、媒体回看、数据库体检）。
version: 2.0.0
author: Wolfycz
repo: "https://github.com/W-Wolfycz/chat_memory"
support_platforms: [aiocqhttp, qq_official]
astrbot_version: ">=4.16,<5"
tags: ["记忆", "存档", "上下文接管", "查询台", "QQ"]
